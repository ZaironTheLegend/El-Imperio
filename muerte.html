
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso interrumpido | Instalación subterránea</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="muerte.css">

    <script src="muerte.js" defer></script>
</head>

<body class="death-page">

    <main class="death-container">

        <div class="death-warning">
            <span>⚠</span>
            <p>SEÑAL VITAL PERDIDA</p>
        </div>

        <h1 id="death-title">VISITANTE ELIMINADO</h1>

        <div class="death-divider"></div>

        <p id="death-description" class="death-description">
            Se ha producido un incidente en la instalación.
        </p>

        <div class="death-record">
            <p>REGISTRO DEL SISTEMA</p>
            <p id="death-record">Cargando información...</p>
        </div>

        <p class="death-footer">
            INSTALACIÓN SUBTERRÁNEA — NIVEL 5
        </p>

        <button id="retry-button" class="retry-button">
            VOLVER A INTENTARLO
        </button>

    </main>

</body>
</html>
